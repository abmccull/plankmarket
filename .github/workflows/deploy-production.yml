name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned deploy CLI dependencies
        run: npm ci --prefix .github/vercel-cli

      - name: Quality and security gate
        env:
          SKIP_ENV_VALIDATION: true
        run: |
          npm run lint
          npm run typecheck
          npm run typecheck:tests
          npm run test
          npm run test:shipping
          npm run audit:prod
          npm run db:check
          npm run build

      - name: Audit root dependency graph
        id: audit_root
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-artifacts
          set +e
          npm audit --audit-level=high --json > ci-artifacts/npm-audit-root.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Audit deploy CLI dependency graph
        id: audit_vercel_cli
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --prefix .github/vercel-cli --audit-level=high --json > ci-artifacts/npm-audit-vercel-cli.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Generate SBOM evidence
        shell: bash
        run: |
          ./node_modules/.bin/cyclonedx-npm \
            --ignore-npm-errors \
            --package-lock-only \
            --output-reproducible \
            --of JSON \
            -o ci-artifacts/sbom-root.cdx.json
          (
            cd .github/vercel-cli
            ../../node_modules/.bin/cyclonedx-npm \
              --ignore-npm-errors \
              --package-lock-only \
              --output-reproducible \
              --of JSON \
              -o ../../ci-artifacts/sbom-vercel-cli.cdx.json
          )

      - name: Enforce full dependency audit gate
        if: always()
        shell: bash
        env:
          ROOT_AUDIT_STATUS: ${{ steps.audit_root.outputs.status }}
          VERCEL_CLI_AUDIT_STATUS: ${{ steps.audit_vercel_cli.outputs.status }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const checks = [
            ['root', 'ci-artifacts/npm-audit-root.json', Number(process.env.ROOT_AUDIT_STATUS ?? '1')],
            ['vercel-cli', 'ci-artifacts/npm-audit-vercel-cli.json', Number(process.env.VERCEL_CLI_AUDIT_STATUS ?? '1')],
          ];

          let failed = false;
          for (const [name, file, status] of checks) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const counts = report.metadata?.vulnerabilities ?? {};
            console.log(`${name}: ${JSON.stringify(counts)}`);
            if (status !== 0 || (counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) {
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-validation-evidence
          path: ci-artifacts
          if-no-files-found: error

  preflight_production:
    name: Production Preflight
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned deploy CLI dependencies
        run: npm ci --prefix .github/vercel-cli

      - name: Link protected production project
        shell: bash
        run: |
          mkdir -p .vercel
          cat <<EOF > .vercel/project.json
          {"projectId":"$VERCEL_PROJECT_ID","orgId":"$VERCEL_ORG_ID"}
          EOF

      - name: Pull protected production settings
        run: >-
          ./.github/vercel-cli/node_modules/.bin/vercel pull --yes --environment=production
          --token="$VERCEL_TOKEN"

      - name: Pull protected production environment
        run: >-
          ./.github/vercel-cli/node_modules/.bin/vercel env pull .vercel/.env.production.local --yes
          --environment=production
          --token="$VERCEL_TOKEN"

      - name: Validate production environment
        run: npm run env:check:production -- --file .vercel/.env.production.local

      - name: Verify target database schema before deploy
        run: npm run db:check:target -- --file .vercel/.env.production.local

      - name: Audit target marketplace data before deploy
        run: npm run db:audit:marketplace -- --file .vercel/.env.production.local

      - name: Remove transient production env file
        if: always()
        run: rm -f .vercel/.env.production.local

  deploy:
    name: Stage Production Deployment
    needs: preflight_production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install pinned deploy CLI dependencies
        run: npm ci --prefix .github/vercel-cli

      - name: Link production project
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          cat <<EOF > .vercel/project.json
          {"projectId":"$VERCEL_PROJECT_ID","orgId":"$VERCEL_ORG_ID"}
          EOF

      - name: Create staged production deployment
        id: deploy
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          raw_url=$(
            .github/vercel-cli/node_modules/.bin/vercel deploy \
              --prod \
              --skip-domain \
              --archive=tgz \
              --yes \
              --token="$VERCEL_TOKEN" \
              --build-env="PLANKMARKET_BUILD_SHA=$GITHUB_SHA" \
              --build-env="SKIP_ENV_VALIDATION=1" \
              --env="PLANKMARKET_BUILD_SHA=$GITHUB_SHA"
          )
          url=$(DEPLOY_URL="$raw_url" node <<'NODE'
          const value = process.env.DEPLOY_URL?.trim();
          let url;
          try {
            url = new URL(value);
          } catch {
            console.error('Vercel returned an invalid deployment URL');
            process.exit(1);
          }
          const isVercelDeployment =
            url.hostname !== 'vercel.app' && url.hostname.endsWith('.vercel.app');
          if (
            url.protocol !== 'https:' ||
            !isVercelDeployment ||
            url.username ||
            url.password ||
            url.port ||
            url.pathname !== '/' ||
            url.search ||
            url.hash
          ) {
            console.error('Vercel returned an untrusted deployment URL');
            process.exit(1);
          }
          process.stdout.write(url.origin);
          NODE
          )
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

  verify_staged_liveness:
    name: Verify Staged Liveness
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      STAGED_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - name: Verify staged liveness
        run: >-
          curl -fsS --retry 5 --retry-all-errors
          "$STAGED_URL/api/health"

  verify_staged_readiness:
    name: Verify Staged Readiness
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0

      - name: Revalidate staged deployment URL
        id: deployment_url
        shell: bash
        env:
          CANDIDATE_URL: ${{ needs.deploy.outputs.url }}
        run: |
          url=$(node <<'NODE'
          const value = process.env.CANDIDATE_URL?.trim();
          let url;
          try {
            url = new URL(value);
          } catch {
            process.exit(1);
          }
          const isVercelDeployment =
            url.hostname !== 'vercel.app' && url.hostname.endsWith('.vercel.app');
          if (
            url.protocol !== 'https:' ||
            !isVercelDeployment ||
            url.username ||
            url.password ||
            url.port ||
            url.pathname !== '/' ||
            url.search ||
            url.hash
          ) {
            process.exit(1);
          }
          process.stdout.write(url.origin);
          NODE
          )
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Verify staged readiness and candidate fingerprint
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STAGED_URL: ${{ steps.deployment_url.outputs.url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          curl -fsS --retry 5 --retry-all-errors \
            -H "authorization: Bearer $CRON_SECRET" \
            "$STAGED_URL/api/health/ready" \
            -o readiness.json
          node <<'NODE'
          const fs = require('fs');
          const packageJson = require('./package.json');
          const releaseContract = require('./src/lib/release-contract.json');

          const payload = JSON.parse(fs.readFileSync('readiness.json', 'utf8'));
          const release = payload?.meta?.release;
          if (!release) {
            console.error('Protected readiness did not return release metadata.');
            process.exit(1);
          }

          const expected = {
            buildSha: process.env.EXPECTED_BUILD_SHA,
            packageVersion: packageJson.version,
            schemaVersion: releaseContract.schemaVersion,
            commercialPolicyVersion: releaseContract.commercialPolicyVersion,
          };
          expected.fingerprint = [
            `pkg:${expected.packageVersion}`,
            `schema:${expected.schemaVersion}`,
            `policy:${expected.commercialPolicyVersion}`,
            `sha:${expected.buildSha}`,
          ].join('|');

          for (const [field, expectedValue] of Object.entries(expected)) {
            if (release[field] !== expectedValue) {
              console.error(`Staged ${field} mismatch: expected ${expectedValue}, received ${release[field] ?? 'null'}`);
              process.exit(1);
            }
          }
          NODE

  smoke_staged:
    name: Smoke Staged Production
    needs:
      - deploy
      - verify_staged_liveness
      - verify_staged_readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      STAGED_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staged public marketplace smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGED_URL }}
        run: npm run test:e2e:public

  promote:
    name: Promote Verified Deployment
    needs:
      - deploy
      - smoke_staged
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm

      - name: Revalidate staged deployment URL
        id: staged_url
        shell: bash
        env:
          CANDIDATE_URL: ${{ needs.deploy.outputs.url }}
        run: |
          url=$(node <<'NODE'
          const value = process.env.CANDIDATE_URL?.trim();
          let url;
          try {
            url = new URL(value);
          } catch {
            process.exit(1);
          }
          const isVercelDeployment =
            url.hostname !== 'vercel.app' && url.hostname.endsWith('.vercel.app');
          if (
            url.protocol !== 'https:' ||
            !isVercelDeployment ||
            url.username ||
            url.password ||
            url.port ||
            url.pathname !== '/' ||
            url.search ||
            url.hash
          ) {
            process.exit(1);
          }
          process.stdout.write(url.origin);
          NODE
          )
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Install pinned deploy CLI dependencies
        run: npm ci --prefix .github/vercel-cli

      - name: Link production project
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          cat <<EOF > .vercel/project.json
          {"projectId":"$VERCEL_PROJECT_ID","orgId":"$VERCEL_ORG_ID"}
          EOF

      - name: Record last-good production alias
        id: last_good
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
        run: |
          if [ -z "$PRODUCTION_APP_URL" ]; then
            echo "deployment=" >> "$GITHUB_OUTPUT"
            echo "PRODUCTION_APP_URL is unset; skipping last-good capture."
            exit 0
          fi
          host=$(node <<'NODE'
          try {
            const url = new URL(process.env.PRODUCTION_APP_URL.trim());
            process.stdout.write(url.hostname);
          } catch {
            process.exit(0);
          }
          NODE
          ) || true
          current=""
          if [ -n "$host" ]; then
            api="https://api.vercel.com/v13/deployments/${host}"
            if [ -n "$VERCEL_ORG_ID" ]; then
              api="${api}?teamId=${VERCEL_ORG_ID}"
            fi
            current=$(
              curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$api" |
                node -e '
                  const fs = require("fs");
                  const payload = JSON.parse(fs.readFileSync(0, "utf8"));
                  const deployment = payload?.id ? payload : payload?.deployment;
                  process.stdout.write(typeof deployment?.id === "string" ? deployment.id : "");
                '
            ) || true
          fi
          if [ -n "$current" ]; then
            echo "deployment=$current" >> "$GITHUB_OUTPUT"
            echo "Recorded last-good production deployment: $current"
          else
            echo "deployment=" >> "$GITHUB_OUTPUT"
            echo "No prior production deployment id captured; promote will continue."
          fi

      - name: Promote verified deployment
        env:
          STAGED_URL: ${{ steps.staged_url.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          LAST_GOOD: ${{ steps.last_good.outputs.deployment }}
        run: |
          echo "last_good=${LAST_GOOD}" >> "$GITHUB_STEP_SUMMARY"
          echo "To roll back after a bad promote: vercel promote ${LAST_GOOD} --yes" >> "$GITHUB_STEP_SUMMARY"
          ./.github/vercel-cli/node_modules/.bin/vercel promote "$STAGED_URL" --yes --token="$VERCEL_TOKEN"

      - name: Resolve promoted production alias
        id: production_alias
        shell: bash
        env:
          EXPECTED_PRODUCTION_URL: ${{ vars.PRODUCTION_APP_URL }}
          STAGED_URL: ${{ steps.staged_url.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          expected_url=$(node <<'NODE'
          const value = process.env.EXPECTED_PRODUCTION_URL?.trim();
          let url;
          try {
            url = new URL(value);
          } catch {
            console.error('PRODUCTION_APP_URL must be an absolute URL');
            process.exit(1);
          }
          const isPlankMarketHost =
            url.hostname === 'plankmarket.com' || url.hostname.endsWith('.plankmarket.com');
          if (
            url.protocol !== 'https:' ||
            !isPlankMarketHost ||
            url.username ||
            url.password ||
            url.port ||
            url.pathname !== '/' ||
            url.search ||
            url.hash
          ) {
            console.error('PRODUCTION_APP_URL is not a trusted PlankMarket origin');
            process.exit(1);
          }
          process.stdout.write(url.origin);
          NODE
          )
          host=$(EXPECTED_PRODUCTION_URL="$expected_url" node -e 'process.stdout.write(new URL(process.env.EXPECTED_PRODUCTION_URL).hostname)')
          api="https://api.vercel.com/v13/deployments/${host}"
          if [ -n "$VERCEL_ORG_ID" ]; then
            api="${api}?teamId=${VERCEL_ORG_ID}"
          fi
          production_url=""
          for attempt in $(seq 1 12); do
            if curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$api" -o .vercel/production-deployment.json; then
              if production_url=$(EXPECTED_PRODUCTION_URL="$expected_url" node <<'NODE'
          const fs = require('fs');

          const stagedHost = new URL(process.env.STAGED_URL).hostname;
          const expectedUrl = new URL(process.env.EXPECTED_PRODUCTION_URL);
          const payload = JSON.parse(fs.readFileSync('.vercel/production-deployment.json', 'utf8'));
          const deployment = payload?.id ? payload : payload?.deployment;
          const deployedHost = String(deployment?.url ?? '').replace(/^https?:\/\//, '');
          if (deployedHost !== stagedHost) {
            console.error(
              `PRODUCTION_APP_URL still points at ${deployedHost || 'unknown'}; expected ${stagedHost}`,
            );
            process.exit(1);
          }
          process.stdout.write(expectedUrl.origin);
          NODE
              ); then
                break
              fi
            else
              echo "Could not inspect PRODUCTION_APP_URL yet (attempt ${attempt}/12)"
            fi
            echo "Waiting for PRODUCTION_APP_URL to bind to staged deployment (attempt ${attempt}/12)"
            sleep 5
          done
          if [ -z "$production_url" ]; then
            echo "The promoted deployment is not bound to PRODUCTION_APP_URL"
            exit 1
          fi
          printf 'url=%s\n' "$production_url" >> "$GITHUB_OUTPUT"

      - name: Verify production liveness
        env:
          PRODUCTION_URL: ${{ steps.production_alias.outputs.url }}
        run: >-
          curl -fsS --retry 5 --retry-all-errors
          "$PRODUCTION_URL/api/health"

      - name: Revalidate production URL before secret use
        id: production_url
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.production_alias.outputs.url }}
          EXPECTED_PRODUCTION_URL: ${{ vars.PRODUCTION_APP_URL }}
        run: |
          url=$(node <<'NODE'
          let candidate;
          let expected;
          try {
            candidate = new URL(process.env.CANDIDATE_URL?.trim());
            expected = new URL(process.env.EXPECTED_PRODUCTION_URL?.trim());
          } catch {
            process.exit(1);
          }
          const isPlankMarketHost =
            candidate.hostname === 'plankmarket.com' ||
            candidate.hostname.endsWith('.plankmarket.com');
          if (
            candidate.origin !== expected.origin ||
            candidate.protocol !== 'https:' ||
            !isPlankMarketHost ||
            candidate.username ||
            candidate.password ||
            candidate.port ||
            candidate.pathname !== '/' ||
            candidate.search ||
            candidate.hash
          ) {
            process.exit(1);
          }
          process.stdout.write(candidate.origin);
          NODE
          )
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Verify production readiness and candidate fingerprint
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ steps.production_url.outputs.url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          curl -fsS --retry 5 --retry-all-errors \
            -H "authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/health/ready" \
            -o production-readiness.json
          node <<'NODE'
          const fs = require('fs');
          const packageJson = require('./package.json');
          const releaseContract = require('./src/lib/release-contract.json');

          const payload = JSON.parse(fs.readFileSync('production-readiness.json', 'utf8'));
          const release = payload?.meta?.release;
          if (!release) {
            console.error('Protected production readiness did not return release metadata.');
            process.exit(1);
          }

          const expected = {
            buildSha: process.env.EXPECTED_BUILD_SHA,
            packageVersion: packageJson.version,
            schemaVersion: releaseContract.schemaVersion,
            commercialPolicyVersion: releaseContract.commercialPolicyVersion,
          };
          expected.fingerprint = [
            `pkg:${expected.packageVersion}`,
            `schema:${expected.schemaVersion}`,
            `policy:${expected.commercialPolicyVersion}`,
            `sha:${expected.buildSha}`,
          ].join('|');

          for (const [field, expectedValue] of Object.entries(expected)) {
            if (release[field] !== expectedValue) {
              console.error(`Production ${field} mismatch: expected ${expectedValue}, received ${release[field] ?? 'null'}`);
              process.exit(1);
            }
          }
          NODE
